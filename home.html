<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="Tracklet — start a new project or pick up where you left off. Browser-based motion tracking."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved appearance before paint so the first frame is correct.
      (() => {
        try {
          const stored = localStorage.getItem('tracklet.ui.theme');
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          /* localStorage can be blocked in private mode */
        }
      })();
    </script>
    <title>Tracklet — Projects</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-home.tsx"></script>
  </body>
</html>
